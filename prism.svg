<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
  <!-- White Light Beam -->
  <path d="M0,200 L140,162" stroke="#FFFFFF" stroke-width="5" />
  
  <!-- The Prism -->
  <polygon points="200,60 100,230 300,230" fill="none" stroke="#FFFFFF" stroke-width="4" stroke-linejoin="round"/>
  
  <!-- Inside Refraction (Fading White to Colors) -->
  <path d="M140,162 L240,130" stroke="rgba(255,255,255,0.6)" stroke-width="2" />
  <path d="M140,162 L257,171" stroke="rgba(255,255,255,0.3)" stroke-width="2" />
  
  <!-- The Rainbow -->
  <path d="M240,130 L400,100" stroke="#FF0000" stroke-width="6" />
  <path d="M243,138 L400,115" stroke="#FF7F00" stroke-width="6" />
  <path d="M247,146 L400,130" stroke="#FFFF00" stroke-width="6" />
  <path d="M250,154 L400,145" stroke="#00FF00" stroke-width="6" />
  <path d="M254,163 L400,160" stroke="#0000FF" stroke-width="6" />
  <path d="M257,171 L400,175" stroke="#8B00FF" stroke-width="6" />
</svg>
